name: aws-hackathon
services:
  sandbox:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "${LOCAL_UID:-501}:${LOCAL_GID:-20}"
    ports:
      - "127.0.0.1:5173:8000"
    environment:
      AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
      AWS_CONFIG_FILE: /run/aws/config
      AWS_PROFILE: aws-hackathon-2026
      AWS_REGION: us-east-1
    volumes:
      - ./.local:/app/.local
      - ./.env.local:/app/.env.local:ro
      - ${HOME}/.aws/aws-hackathon-2026.credentials:/run/aws/credentials:ro
      - ${HOME}/.aws/aws-hackathon-2026.config:/run/aws/config:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 8s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 3s
      start_period: 30s
